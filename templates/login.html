
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">

        <h1>Welcome Back!</h1>
        <p class="subtitle">Please login to your account</p>

        <form action="#" method="post">

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" name="remember">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

        </form>

        <p class="signup-link">
            Don't have an account?
            <a href="index.html">Sign Up</a>
        </p>

    </div>

</body>
<style>
    
/* Reset default styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Page styling */
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

/* Login card */
.login-container {
    background: white;
    width: 100%;
    max-width: 400px;

    padding: 35px;
    border-radius: 15px;

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

/* Heading */
h1 {
    text-align: center;
    color: #333;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

/* Input fields */
.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: bold;
}

.input-group input {
    width: 100%;
    padding: 12px;

    border: 1px solid #ccc;
    border-radius: 7px;

    font-size: 15px;
    outline: none;
}

.input-group input:focus {
    border-color: #667eea;
    box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
}

/* Remember me and forgot password */
.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;

    margin-bottom: 25px;
    font-size: 13px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #555;
}

.remember input {
    accent-color: #667eea;
}

.form-options a {
    color: #667eea;
    text-decoration: none;
}

.form-options a:hover {
    text-decoration: underline;
}

/* Login button */
button {
    width: 100%;
    padding: 13px;

    background: #667eea;
    color: white;

    border: none;
    border-radius: 7px;

    font-size: 16px;
    font-weight: bold;
    cursor: pointer;

    transition: background 0.3s;
}

button:hover {
    background: #5145cd;
}

/* Sign up link */
.signup-link {
    text-align: center;
    margin-top: 25px;
    color: #666;
    font-size: 14px;
}

.signup-link a {
    color: #667eea;
    font-weight: bold;
    text-decoration: none;
}

.signup-link a:hover {
    text-decoration: underline;
}

/* Mobile responsive */
@media (max-width: 480px) {
    .login-container {
        padding: 25px 20px;
    }

    .form-options {
        font-size: 12px;
    }
}

</style>
</html>
